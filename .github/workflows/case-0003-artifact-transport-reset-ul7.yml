$ErrorActionPreference = 'Stop'

$stage = Join-Path $env:RUNNER_TEMP "case0003-evidence-$env:GITHUB_RUN_ID"
New-Item -ItemType Directory -Force $stage | Out-Null

# Basic system information
Get-ComputerInfo |
    Select-Object WindowsProductName, WindowsVersion,
                  OsBuildNumber, OsArchitecture,
                  CsManufacturer, CsModel |
    ConvertTo-Json |
    Set-Content (Join-Path $stage "system.json") -Encoding UTF8

# Network configuration
Get-NetIPAddress -AddressFamily IPv4 |
    Select-Object IPAddress, InterfaceAlias, AddressState |
    ConvertTo-Json |
    Set-Content (Join-Path $stage "network.json") -Encoding UTF8

# Current runner information
@{
    computer_name = $env:COMPUTERNAME
    runner_name   = $env:RUNNER_NAME
    runner_os     = $env:RUNNER_OS
    runner_arch   = $env:RUNNER_ARCH
    repository    = $env:GITHUB_REPOSITORY
    workflow      = $env:GITHUB_WORKFLOW
    run_id        = $env:GITHUB_RUN_ID
    run_number    = $env:GITHUB_RUN_NUMBER
    sha           = $env:GITHUB_SHA
    actor         = $env:GITHUB_ACTOR
    timestamp_utc = (Get-Date).ToUniversalTime().ToString("o")
} |
ConvertTo-Json |
Set-Content (Join-Path $stage "github-run.json") -Encoding UTF8

# Hash the evidence files
Get-ChildItem $stage -File |
    Get-FileHash -Algorithm SHA256 |
    Select-Object Path, Hash |
    ConvertTo-Json |
    Set-Content (Join-Path $stage "SHA256SUMS.json") -Encoding UTF8

# Package evidence
$zip = Join-Path $env:RUNNER_TEMP "case0003-evidence-$env:GITHUB_RUN_ID.zip"

Compress-Archive `
    -Path "$stage\*" `
    -DestinationPath $zip `
    -Force

Write-Host "Evidence package created:"
Write-Host $zip


