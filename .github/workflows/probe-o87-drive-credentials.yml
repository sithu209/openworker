name: Probe O87 Drive Credentials

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.event.pull_request.title == '[openworker-control] probe_o87_drive_credentials' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, O87]
    timeout-minutes: 5
    env:
      OW_ACCESS_TOKEN: ${{ secrets.OPENWORKER_GOOGLE_DRIVE_ACCESS_TOKEN }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      OW_GOOGLE_CREDENTIALS_JSON: ${{ secrets.OPENWORKER_GOOGLE_APPLICATION_CREDENTIALS_JSON }}
    steps:
      - name: Check credential availability without disclosure
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ine 'DESKTOP-O87PJNR'){throw "wrong host=$env:COMPUTERNAME"}
          $tokenPresent=-not [string]::IsNullOrWhiteSpace($env:OW_ACCESS_TOKEN)
          $googleJsonPresent=-not [string]::IsNullOrWhiteSpace($env:GOOGLE_CREDENTIALS_JSON)
          $owJsonPresent=-not [string]::IsNullOrWhiteSpace($env:OW_GOOGLE_CREDENTIALS_JSON)
          $adcPath=[Environment]::GetEnvironmentVariable('GOOGLE_APPLICATION_CREDENTIALS','Machine')
          $adcMachinePresent=(-not [string]::IsNullOrWhiteSpace($adcPath)) -and (Test-Path -LiteralPath $adcPath -PathType Leaf -ErrorAction SilentlyContinue)
          Write-Host "OPENWORKER_O87_DRIVE_CREDENTIAL_PROBE token_secret=$tokenPresent google_json_secret=$googleJsonPresent ow_json_secret=$owJsonPresent machine_adc=$adcMachinePresent"
          if(-not($tokenPresent -or $googleJsonPresent -or $owJsonPresent -or $adcMachinePresent)){throw 'no usable Drive credential source found for O87 NetworkService'}
