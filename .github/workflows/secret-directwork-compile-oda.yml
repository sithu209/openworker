name: Secret DirectWork Compile ODA

on:
  push:
    branches: [main]
    paths:
      - 'secret-requests/directwork-compile-oda.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: [self-hosted, Windows, X64, ODA]
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send DIRECTWORK.COMPILE to OpenWorker durable authority
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ine 'DESKTOP-ODAQN0D'){ throw "wrong host $env:COMPUTERNAME expected=DESKTOP-ODAQN0D" }

          $requestPath=Join-Path $env:GITHUB_WORKSPACE 'secret-requests\directwork-compile-oda.json'
          $req=Get-Content -LiteralPath $requestPath -Raw | ConvertFrom-Json -ErrorAction Stop
          if([string]$req.schema -ne 'openworker.secret-command.v1'){throw "bad schema=$($req.schema)"}
          if([string]$req.phrase -ne 'DIRECTWORK.COMPILE'){throw "bad phrase=$($req.phrase)"}
          $requestId=[string]$req.request_id
          if($requestId -notmatch '^[A-Za-z0-9._-]{8,96}$'){throw "bad request_id=$requestId"}

          $source=Join-Path $env:GITHUB_WORKSPACE 'migration\directwork-src'
          $sourceCommit=''
          try{$sourceCommit=(Get-Content -LiteralPath (Join-Path $source 'SOURCE_COMMIT.txt') -Raw).Trim()}catch{}
          $jobId=("secret-directwork-compile-"+$requestId).ToLowerInvariant()
          $artifactDir=Join-Path $env:ProgramData ("OpenWorker\secret-work\"+$requestId+"\artifacts")
          $artifactPath=Join-Path $artifactDir 'directwork-node.exe'

          $ack=$null;$job=$null;$events=$null;$artifacts=$null;$transportError='';$stdout='';$stderr='';$artifact=$null
          try {
            # IMPORTANT: GitHub Action does not prepare/copy/build source. It only sends one durable job.
            # mkdir, go version, dependency download, tests and build all execute inside OpenWorker Slot/Executor.
            $cmd='if not exist "'+$artifactDir+'" mkdir "'+$artifactDir+'" && cd /d "'+$source+'" && echo SECRET=DIRECTWORK.COMPILE && echo SOURCE='+$source+' && go version && go mod download && go test ./... -count=1 && go build -buildvcs=false -o "'+$artifactPath+'" ./cmd/directwork-node'
            $body=[ordered]@{
              job_id=$jobId;dispatch_id=$requestId;machine='DESKTOP-ODAQN0D';priority=100
              command=$cmd;cwd=$source;workspace_root=$source;timeout_sec=1800;locks=@('directwork.compile')
            }
            $ack=Invoke-RestMethod -Method POST -Uri 'http://127.0.0.1:8787/v1/jobs' -ContentType 'application/json' -Body ($body|ConvertTo-Json -Depth 20) -TimeoutSec 10
            if($ack.accepted -ne $true){throw 'OpenWorker did not accept durable compile job'}

            $terminal=@('succeeded','failed','timed_out','cancelled','stale')
            for($i=0;$i -lt 1800;$i++){
              $job=Invoke-RestMethod -Method GET -Uri ('http://127.0.0.1:8787/v1/jobs/'+[uri]::EscapeDataString($jobId)) -TimeoutSec 10
              if($terminal -contains [string]$job.status){break}
              Start-Sleep -Seconds 1
            }
            if($null-eq$job){throw 'durable compile job not readable'}
            try{$events=Invoke-RestMethod -Method GET -Uri ('http://127.0.0.1:8787/v1/jobs/'+[uri]::EscapeDataString($jobId)+'/events?limit=200') -TimeoutSec 10}catch{$events=[ordered]@{error=$_.Exception.Message}}
            try{$artifacts=Invoke-RestMethod -Method GET -Uri ('http://127.0.0.1:8787/v1/jobs/'+[uri]::EscapeDataString($jobId)+'/artifacts') -TimeoutSec 10}catch{$artifacts=[ordered]@{error=$_.Exception.Message}}
            if($job.stdout_path -and (Test-Path -LiteralPath $job.stdout_path)){ $stdout=(Get-Content -LiteralPath $job.stdout_path -Raw -ErrorAction SilentlyContinue); if($stdout.Length -gt 120000){$stdout=$stdout.Substring($stdout.Length-120000)} }
            if($job.stderr_path -and (Test-Path -LiteralPath $job.stderr_path)){ $stderr=(Get-Content -LiteralPath $job.stderr_path -Raw -ErrorAction SilentlyContinue); if($stderr.Length -gt 120000){$stderr=$stderr.Substring($stderr.Length-120000)} }
            if(Test-Path -LiteralPath $artifactPath -PathType Leaf){$f=Get-Item -LiteralPath $artifactPath;$artifact=[ordered]@{path=$f.FullName;size=$f.Length;sha256=(Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()}}
          } catch {
            $transportError=$_.Exception.Message
            if($null-eq$job){ try{$job=Invoke-RestMethod -Method GET -Uri ('http://127.0.0.1:8787/v1/jobs/'+[uri]::EscapeDataString($jobId)) -TimeoutSec 5}catch{} }
            if($null-ne$job){
              try{$events=Invoke-RestMethod -Method GET -Uri ('http://127.0.0.1:8787/v1/jobs/'+[uri]::EscapeDataString($jobId)+'/events?limit=200') -TimeoutSec 5}catch{}
              if($job.stdout_path -and (Test-Path -LiteralPath $job.stdout_path)){ $stdout=Get-Content -LiteralPath $job.stdout_path -Raw -ErrorAction SilentlyContinue }
              if($job.stderr_path -and (Test-Path -LiteralPath $job.stderr_path)){ $stderr=Get-Content -LiteralPath $job.stderr_path -Raw -ErrorAction SilentlyContinue }
            }
          }

          $receipt=[ordered]@{
            schema='openworker.secret-compile-receipt.v2';phrase='DIRECTWORK.COMPILE';request_id=$requestId;source_commit=$sourceCommit
            authority='openworker-local-supervisor';transport='github_actions';github_action_used_for_command_transport=$true;github_action_used_for_business_execution=$false
            transport_error=$transportError;ack=$ack;durable_job=$job;durable_events=$events;artifacts_api=$artifacts;artifact=$artifact;stdout=$stdout;stderr=$stderr
            github_run_id=$env:GITHUB_RUN_ID;observed_at=[DateTimeOffset]::UtcNow.ToString('o')
          }
          $rel="secret-results/directwork-compile/$requestId.json"
          $receiptPath=Join-Path $env:GITHUB_WORKSPACE ($rel -replace '/','\')
          New-Item -ItemType Directory -Force -Path (Split-Path $receiptPath)|Out-Null
          [IO.File]::WriteAllText($receiptPath,($receipt|ConvertTo-Json -Depth 80)+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          git config user.name 'openworker-secret-compile'
          git config user.email 'openworker-secret-compile@users.noreply.github.com'
          git add -- $rel
          git commit -m ("receipt: DIRECTWORK.COMPILE "+$requestId)
          if($LASTEXITCODE -ne 0){throw 'failed to commit compile receipt'}
          $pushed=$false
          for($n=0;$n -lt 4;$n++){git pull --rebase origin main;if($LASTEXITCODE -ne 0){git rebase --abort 2>$null;Start-Sleep -Seconds 1;continue};git push origin HEAD:main;if($LASTEXITCODE -eq 0){$pushed=$true;break};Start-Sleep -Seconds 2}
          if(-not $pushed){throw 'failed to push compile receipt'}
          if($transportError){throw "DIRECTWORK.COMPILE transport failed: $transportError"}
          if([string]$job.status -ne 'succeeded'){throw "DIRECTWORK.COMPILE failed durable_status=$($job.status) exit=$($job.exit_code)"}
