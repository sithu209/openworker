name: Dispatch ODA Migrate DirectWork Secret

on:
  push:
    branches: [main]
    paths:
      - 'examples/control-envelope/oda-migrate-directwork.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: [self-hosted, Windows, X64, ODA]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute NODE.MIGRATE_DIRECTWORK secret locally
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ine 'DESKTOP-ODAQN0D'){throw "wrong host $env:COMPUTERNAME"}
          $who=[Security.Principal.WindowsIdentity]::GetCurrent().Name
          if($who -notmatch 'SYSTEM$'){throw "runner identity is not SYSTEM: $who"}
          $secretPath=Join-Path $env:GITHUB_WORKSPACE 'examples\control-envelope\oda-migrate-directwork.json'
          if(-not(Test-Path -LiteralPath $secretPath -PathType Leaf)){throw 'migration secret missing'}
          $s=Get-Content -LiteralPath $secretPath -Raw|ConvertFrom-Json -ErrorAction Stop
          if([string]$s.schema -ne 'node.migration-secret.v1'){throw "bad schema $($s.schema)"}
          if([string]$s.command -ne 'NODE.MIGRATE_DIRECTWORK'){throw "bad command $($s.command)"}
          if([string]$s.machine -ine 'DESKTOP-ODAQN0D'){throw "bad machine $($s.machine)"}
          $rid=[string]$s.request_id
          if($rid -notmatch '^[A-Za-z0-9._-]{8,128}$'){throw 'invalid request_id'}
          $url=[string]$s.handoff.url
          $wantZip=([string]$s.handoff.zip_sha256).ToLowerInvariant()
          $wantExe=([string]$s.handoff.binary_sha256).ToLowerInvariant()
          $sourceCommit=[string]$s.handoff.source_commit
          if([string]::IsNullOrWhiteSpace($url)-or[string]::IsNullOrWhiteSpace($wantZip)-or[string]::IsNullOrWhiteSpace($wantExe)){throw 'handoff URL/ZIP SHA/EXE SHA missing'}

          $stage=Join-Path 'C:\ProgramData\DirectWork\handoff-incoming' $rid
          New-Item -ItemType Directory -Force -Path $stage|Out-Null
          $zip=Join-Path $stage 'directwork-node.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $zip -TimeoutSec 90
          $gotZip=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($gotZip -ne $wantZip){throw "ZIP SHA mismatch got=$gotZip want=$wantZip"}
          $extract=Join-Path $stage 'extract'
          Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extract|Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $download=Join-Path $extract 'directwork-node.exe'
          if(-not(Test-Path -LiteralPath $download -PathType Leaf)){throw 'directwork-node.exe missing after ZIP extraction'}
          $gotExe=(Get-FileHash $download -Algorithm SHA256).Hash.ToLowerInvariant()
          if($gotExe -ne $wantExe){throw "EXE SHA mismatch got=$gotExe want=$wantExe"}

          $old='OpenWorkerNode';$new='DirectWorkNode'
          $oldSvc=Get-Service $old -ErrorAction SilentlyContinue
          if($oldSvc){
            if($oldSvc.Status -ne 'Stopped'){Stop-Service $old -Force -ErrorAction SilentlyContinue;Start-Sleep -Seconds 2}
            sc.exe delete $old|Out-Null
            Start-Sleep -Seconds 1
          }
          Get-Process -ErrorAction SilentlyContinue|Where-Object{$_.ProcessName -match '^(openworker|openworker-node|openworkernode)$'}|ForEach-Object{Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue}
          if(Get-Service $old -ErrorAction SilentlyContinue){throw 'OpenWorkerNode still exists'}
          if(@(Get-Process -ErrorAction SilentlyContinue|Where-Object{$_.ProcessName -match '^(openworker|openworker-node|openworkernode)$'}).Count -gt 0){throw 'OpenWorker process still exists'}

          $root='C:\ProgramData\DirectWork';$binDir=Join-Path $root 'bin';$data=Join-Path $root 'node'
          New-Item -ItemType Directory -Force -Path $binDir,$data|Out-Null
          if(Get-Service $new -ErrorAction SilentlyContinue){Stop-Service $new -Force -ErrorAction SilentlyContinue;Start-Sleep -Seconds 1;sc.exe delete $new|Out-Null;Start-Sleep -Seconds 1}
          Get-NetTCPConnection -LocalPort 8787 -State Listen -ErrorAction SilentlyContinue|ForEach-Object{try{Stop-Process -Id $_.OwningProcess -Force -ErrorAction Stop}catch{}}
          $target=Join-Path $binDir 'directwork-node.exe'
          Copy-Item -LiteralPath $download -Destination $target -Force
          if(((Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()) -ne $wantExe){throw 'installed EXE SHA mismatch'}
          $peers='http://DESKTOP-O87PJNR:8787,http://DESKTOP-UL7V2VV:8787'
          $binPath='"{0}" -service -listen 0.0.0.0:8787 -workers 4 -data "{1}" -peers "{2}"' -f $target,$data,$peers
          sc.exe create $new binPath= $binPath start= auto DisplayName= 'DirectWork Node'|Out-Null
          sc.exe description $new 'DirectWork durable local work commander node'|Out-Null
          Start-Service $new

          $status=$null;$deadline=(Get-Date).AddSeconds(45)
          do{Start-Sleep -Milliseconds 500;try{$status=Invoke-RestMethod -Uri 'http://127.0.0.1:8787/v1/node/status' -TimeoutSec 3}catch{}}while((-not$status-or-not$status.online)-and(Get-Date)-lt$deadline)
          if(-not$status-or-not$status.online){throw 'DirectWork did not become healthy'}
          if([string]$status.machine -ine 'DESKTOP-ODAQN0D'){throw "DirectWork machine mismatch $($status.machine)"}
          if([string]$status.commit -ne $sourceCommit){throw "DirectWork running commit mismatch got=$($status.commit) want=$sourceCommit"}
          $listen=Get-NetTCPConnection -LocalPort 8787 -State Listen -ErrorAction Stop|Select-Object -First 1
          $proc=Get-Process -Id $listen.OwningProcess -ErrorAction Stop
          if($proc.ProcessName -notmatch '^directwork-node$'){throw "8787 owner=$($proc.ProcessName)"}

          $smokeDir=Join-Path 'C:\ProgramData\DirectWork\smoke' $rid
          New-Item -ItemType Directory -Force -Path $smokeDir|Out-Null
          $body=[ordered]@{dispatch_id=$rid+'-smoke';case_id='DIRECTWORK-MIGRATION';project='DirectWork';machine='DESKTOP-ODAQN0D';command='echo ODA DirectWork migration smoke > directwork-smoke.txt';cwd=$smokeDir;workspace_root=$smokeDir;timeout_sec=60}|ConvertTo-Json
          $created=Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:8787/v1/work' -ContentType 'application/json' -Body $body -TimeoutSec 10
          $w=$null
          for($i=0;$i-lt120;$i++){Start-Sleep -Milliseconds 500;$w=Invoke-RestMethod -Uri ('http://127.0.0.1:8787/v1/work/'+$created.work_id) -TimeoutSec 5;if($w.status -in @('succeeded','failed','cancelled','timed_out')){break}}
          $events=Invoke-RestMethod -Uri ('http://127.0.0.1:8787/v1/work/'+$created.work_id+'/events') -TimeoutSec 5
          $arts=Invoke-RestMethod -Uri ('http://127.0.0.1:8787/v1/work/'+$created.work_id+'/artifacts') -TimeoutSec 10
          $receipt=[ordered]@{schema='node.migration-secret-receipt.v1';request_id=$rid;command='NODE.MIGRATE_DIRECTWORK';machine=$env:COMPUTERNAME;runner=$env:RUNNER_NAME;identity=$who;handoff=[ordered]@{url=$url;zip_sha256=$gotZip;binary_sha256=$gotExe;source_commit=$sourceCommit};openworker_service_absent=(-not[bool](Get-Service $old -ErrorAction SilentlyContinue));openworker_process_absent=(@(Get-Process -ErrorAction SilentlyContinue|Where-Object{$_.ProcessName -match '^(openworker|openworker-node|openworkernode)$'}).Count -eq 0);directwork_service=(Get-Service $new).Status.ToString();listener_8787=[ordered]@{pid=$listen.OwningProcess;process=$proc.ProcessName};node_status=$status;smoke=[ordered]@{work_id=$created.work_id;status=$w.status;exit_code=$w.exit_code;slot=$w.slot;pid=$w.pid;events=@($events.events|ForEach-Object{$_.type});artifacts=$arts.artifacts};github_run_id=$env:GITHUB_RUN_ID;observed_at=[DateTimeOffset]::UtcNow.ToString('o')}
          $rel='control-results/node-migration/'+$rid+'.json'
          $path=Join-Path $env:GITHUB_WORKSPACE ($rel-replace'/','\')
          New-Item -ItemType Directory -Force -Path (Split-Path $path)|Out-Null
          [IO.File]::WriteAllText($path,($receipt|ConvertTo-Json -Depth 40)+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          git config user.name 'oda-migration-secret';git config user.email 'oda-migration-secret@users.noreply.github.com'
          git add -- $rel
          git commit -m ('receipt: ODA NODE.MIGRATE_DIRECTWORK '+$rid+' run '+$env:GITHUB_RUN_ID)
          git pull --rebase origin main
          git push origin HEAD:main
          if($w.status -ne 'succeeded'){throw "DirectWork smoke failed status=$($w.status) exit=$($w.exit_code)"}
