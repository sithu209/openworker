        run: |
          if($env:COMPUTERNAME -ne 'DESKTOP-UL7V2VV'){throw "wrong computer: $env:COMPUTERNAME"}
          $src=Join-Path $env:GITHUB_WORKSPACE 'migration\directwork-src';$pin=(Get-Content (Join-Path $src 'SOURCE_COMMIT.txt') -Raw).Trim();if($pin -ne $env:DIRECTWORK_COMMIT){throw 'source pin mismatch'}
          Set-Location $src;go mod download;go test ./... -count=1;if($LASTEXITCODE -ne 0){throw 'tests failed; OpenWorker untouched'}
          go build -ldflags "-X github.com/liuxb99/DirectWork/internal/buildinfo.Version=p1 -X github.com/liuxb99/DirectWork/internal/buildinfo.Commit=$env:DIRECTWORK_COMMIT -X github.com/liuxb99/DirectWork/internal/buildinfo.TargetCommit=$env:DIRECTWORK_COMMIT" -o directwork-node.exe ./cmd/directwork-node;if($LASTEXITCODE -ne 0){throw 'build failed'}
          .\scripts\deploy-and-smoke.ps1 -Binary .\directwork-node.exe -ExpectedMachine 'DESKTOP-UL7V2VV' -NodeKey 'ul7' -TargetCommit $env:DIRECTWORK_COMMIT -RunId '${{ github.run_id }}' -Peers 'http://DESKTOP-ODAQN0D:8787,http://DESKTOP-O87PJNR:8787'
          $old=Get-Service OpenWorkerNode -ErrorAction SilentlyContinue;if($old){Stop-Service OpenWorkerNode -Force -ErrorAction SilentlyContinue;sc.exe config OpenWorkerNode start= disabled|Out-Null;sc.exe delete OpenWorkerNode|Out-Null};Start-Sleep 1
          $s=Invoke-RestMethod http://127.0.0.1:8787/v1/node/status;if(-not $s.online -or $s.commit -ne $env:DIRECTWORK_COMMIT){throw 'post-retirement verify failed'}
          $r=Join-Path $env:GITHUB_WORKSPACE 'verification-receipts\${{ github.run_id }}\ul7.json';if(-not(Test-Path $r)){throw 'receipt missing'};$out=Join-Path $env:GITHUB_WORKSPACE 'migration-receipts\${{ github.run_id }}';New-Item -ItemType Directory -Force -Path $out|Out-Null;Copy-Item $r (Join-Path $out 'ul7.json') -Force
          [ordered]@{schema='directwork/openworker-retirement-receipt/v1';verified=$true;node='ul7';machine=$env:COMPUTERNAME;directwork_commit=$env:DIRECTWORK_COMMIT;directwork_service=(Get-Service DirectWorkNode).Status.ToString();openworker_service_present=[bool](Get-Service OpenWorkerNode -ErrorAction SilentlyContinue);openworker_data_preserved=(Test-Path 'C:\ProgramData\OpenWorker');verified_at=(Get-Date).ToUniversalTime().ToString('o')}|ConvertTo-Json -Depth 8|Set-Content (Join-Path $out 'ul7-retirement.json') -Encoding UTF8
      - name: Persist UL7 receipts
        shell: powershell
        run: git config user.name 'directwork-migration'; git config user.email 'directwork-migration@users.noreply.github.com'; git add migration-receipts/${{ github.run_id }}/ul7*.json; git commit -m 'receipt: UL7 migrated to DirectWork run ${{ github.run_id }}'; git push origin HEAD:main
