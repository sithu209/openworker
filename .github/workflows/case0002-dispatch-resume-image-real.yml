name: Case 0002 Dispatch Governed REAL Image Resume

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case0002-dispatch-resume-image-real.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical governed REAL IMAGE workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GH_REPO}/actions/workflows/case0002-resume-image-real-win11.yml/dispatches" \
            -f ref=main
          echo 'CASE0002_GOVERNED_REAL_IMAGE_DISPATCHED ref=main'
