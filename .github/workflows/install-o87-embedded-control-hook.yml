name: Install O87 Embedded Control Hook

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-o87-embedded-control-hook.yml'
      - 'control-triggers/o87-hook-install-*.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: [self-hosted, Windows, X64, O87]
    timeout-minutes: 8
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify fixed O87 host
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ine 'DESKTOP-O87PJNR'){throw "wrong host $env:COMPUTERNAME"}
          Write-Host "O87_EMBEDDED_CONTROL_INSTALL host=$env:COMPUTERNAME runner=$env:RUNNER_NAME"

      - name: Install latest OpenWorker Embedded Control hook and register runner env
        id: hook
        run: |
          $ErrorActionPreference='Stop'
          $raw = & "$env:GITHUB_WORKSPACE\scripts\install-openworker-runner-hook.ps1" -OpenWorkerRepoRoot $env:GITHUB_WORKSPACE
          if($LASTEXITCODE -ne 0){throw "hook installer failed exit=$LASTEXITCODE"}
          $obj = ($raw -join "`n") | ConvertFrom-Json
          if(-not $obj.installed){throw 'hook installer did not report installed=true'}
          if(-not $obj.configuration_verified){throw 'runner hook registration was not verified'}
          Write-Host ($obj | ConvertTo-Json -Depth 10)
          "runner_root=$($obj.runner_root)" >> $env:GITHUB_OUTPUT
          "env_file=$($obj.env_file)" >> $env:GITHUB_OUTPUT
          "hook=$($obj.hook)" >> $env:GITHUB_OUTPUT
          "dispatcher=$($obj.dispatcher)" >> $env:GITHUB_OUTPUT

      - name: Verify deployed files and registered hook line
        run: |
          $ErrorActionPreference='Stop'
          $required=@(
            'C:\ProgramData\OpenWorker\hooks\openworker-job-started-hook.ps1',
            'C:\ProgramData\OpenWorker\hooks\openworker-job-started.cmd',
            'C:\ProgramData\OpenWorker\hooks\invoke-openworker-control-envelope-v1.ps1'
          )
          foreach($p in $required){if(-not(Test-Path -LiteralPath $p -PathType Leaf)){throw "missing deployed file $p"}}
          $envFile='${{ steps.hook.outputs.env_file }}'
          $want='ACTIONS_RUNNER_HOOK_JOB_STARTED=C:\ProgramData\OpenWorker\hooks\openworker-job-started.cmd'
          $hits=@(Get-Content -LiteralPath $envFile | Where-Object {$_ -eq $want})
          if($hits.Count -ne 1){throw "registered hook line missing/duplicate in $envFile"}
          Write-Host 'O87_HOOK_FILES_AND_REGISTRATION_PASS'

      - name: Explicit read-only Embedded Control smoke before runner restart
        run: |
          $ErrorActionPreference='Stop'
          $requestId='o87-hook-smoke-20260819-2119-a1'
          $envelope=[ordered]@{
            schema='openworker.control-envelope.v1'
            request_id=$requestId
            command='SUPERVISOR.STATUS'
            machine='DESKTOP-O87PJNR'
            case_id='0004'
            policy=[ordered]@{max_parallel=4;join='case-defined';fail_closed=$true}
          }
          $env:OPENWORKER_CONTROL=$envelope|ConvertTo-Json -Compress -Depth 10
          try {
            & 'C:\ProgramData\OpenWorker\hooks\openworker-job-started-hook.ps1'
            if($LASTEXITCODE -ne 0){throw "embedded-control smoke failed exit=$LASTEXITCODE"}
          } finally { Remove-Item Env:OPENWORKER_CONTROL -ErrorAction SilentlyContinue }
          $hookReceipt="C:\ProgramData\OpenWorker\hooks\receipts\$requestId.json"
          $dispatchReceipt="C:\ProgramData\OpenWorker\control-envelope\receipts\$requestId.json"
          if(-not(Test-Path -LiteralPath $hookReceipt -PathType Leaf)){throw "hook receipt missing $hookReceipt"}
          if(-not(Test-Path -LiteralPath $dispatchReceipt -PathType Leaf)){throw "dispatcher receipt missing $dispatchReceipt"}
          $h=Get-Content -LiteralPath $hookReceipt -Raw|ConvertFrom-Json
          $d=Get-Content -LiteralPath $dispatchReceipt -Raw|ConvertFrom-Json
          if(-not $h.accepted){throw 'hook smoke rejected'}
          if(-not $d.accepted){throw 'dispatcher smoke rejected'}
          Write-Host 'O87_EMBEDDED_CONTROL_EXPLICIT_SMOKE_PASS'

      - name: Record install receipt
        run: |
          $ErrorActionPreference='Stop'
          $rel='command-results/o87/o87-embedded-control-install-20260819-2119/final.json'
          $path=Join-Path $env:GITHUB_WORKSPACE ($rel -replace '/','\')
          New-Item -ItemType Directory -Force -Path (Split-Path $path)|Out-Null
          $out=[ordered]@{
            schema='openworker.o87-embedded-control-install.v1'
            machine=$env:COMPUTERNAME
            runner=$env:RUNNER_NAME
            hook_files_installed=$true
            runner_hook_registered=$true
            explicit_smoke_passed=$true
            automatic_hook_active_after_runner_restart=$true
            restart_required=$true
            github_run_id=$env:GITHUB_RUN_ID
            observed_at=[DateTimeOffset]::UtcNow.ToString('o')
          }
          [IO.File]::WriteAllText($path,($out|ConvertTo-Json -Depth 10)+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          git config user.name 'openworker-hook-installer'
          git config user.email 'openworker-hook-installer@users.noreply.github.com'
          git add -- $rel
          git commit -m 'receipt(o87): Embedded Control hook environment installed'
          if($LASTEXITCODE -ne 0){throw 'failed to commit install receipt'}
          git pull --rebase origin main
          if($LASTEXITCODE -ne 0){throw 'failed to rebase install receipt'}
          git push origin HEAD:main
          if($LASTEXITCODE -ne 0){throw 'failed to push install receipt'}
