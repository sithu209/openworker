name: Case 0003 Rev801 Drive Handoff UL7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case-0003-rev801-drive-handoff-ul7.yml'

permissions:
  contents: write

env:
  CASE0003_ASSIGNED_HOST: DESKTOP-UL7V2VV
  CASE0003_WORKSPACE: 'D:\AI-Work\jobs\0003-YUJING-BRIDGE'
  CASE0003_REVISION_ID: rev_801b23ef3cb14941af2a0cdb54bb660f
  CASE0003_EXPECTED_MANIFEST_SHA: ef4b12ec3d03a22f89aa2148146c3e1cb004e3bad1f340f707a58787676bf15c
  CASE0003_EXPECTED_SCENEX_SHA: f193a008d143c6b210f2051d3f1dc16304eb282ce5e62cdad7ed670f19845a3d
  CASE0003_HANDOFF_BRANCH: case0003-drive-handoff-rev801b23ef

jobs:
  handoff:
    runs-on: [self-hosted, Windows, X64, UL7]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify exact immutable review revision and stage ZIP
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ine $env:CASE0003_ASSIGNED_HOST){throw 'host mismatch'}
          $bundle=Join-Path $env:CASE0003_WORKSPACE ('.openworker\reviews\'+$env:CASE0003_REVISION_ID)
          foreach($f in @('manifest.json','manifest.sha256','review-request.json','artifacts\scenex-browse.png','artifacts\blender-render.png','artifacts\delivery-index.html')){
            if(-not(Test-Path -LiteralPath (Join-Path $bundle $f) -PathType Leaf)){throw ('bundle member missing '+$f)}
          }
          $manifestSha=(Get-Content -LiteralPath (Join-Path $bundle 'manifest.sha256') -Raw).Trim().ToLowerInvariant()
          if($manifestSha -ne $env:CASE0003_EXPECTED_MANIFEST_SHA){throw ('manifest drift '+$manifestSha)}
          $scenexSha=(Get-FileHash -LiteralPath (Join-Path $bundle 'artifacts\scenex-browse.png') -Algorithm SHA256).Hash.ToLowerInvariant()
          if($scenexSha -ne $env:CASE0003_EXPECTED_SCENEX_SHA){throw ('SceneX drift '+$scenexSha)}
          $root=Join-Path (Get-Location) ('review-handoff\case0003\'+$env:CASE0003_REVISION_ID)
          if(Test-Path -LiteralPath $root){Remove-Item -LiteralPath $root -Recurse -Force}
          New-Item -ItemType Directory -Force $root|Out-Null
          $zip=Join-Path $root 'review-bundle.zip'
          Compress-Archive -Path (Join-Path $bundle '*') -DestinationPath $zip -CompressionLevel Optimal
          if(-not(Test-Path -LiteralPath $zip -PathType Leaf)){throw 'ZIP missing'}
          $zipSha=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $meta=[ordered]@{schema_version='openworker-drive-connector-handoff/v1';case_id='0003';revision_id=$env:CASE0003_REVISION_ID;bundle_manifest_sha256=$manifestSha;cloud_zip_sha256=$zipSha;zip_bytes=(Get-Item -LiteralPath $zip).Length;assigned_host=$env:COMPUTERNAME;github_run_id=$env:GITHUB_RUN_ID}
          [IO.File]::WriteAllText((Join-Path $root 'handoff-manifest.json'),($meta|ConvertTo-Json -Depth 5),[Text.UTF8Encoding]::new($false))
          Write-Host ('CASE0003_REV801_HANDOFF_READY '+($meta|ConvertTo-Json -Compress))

      - name: Publish exact binary handoff branch
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B $env:CASE0003_HANDOFF_BRANCH
          git add -- review-handoff/case0003/$env:CASE0003_REVISION_ID
          git commit -m "case0003: stage exact Drive handoff $env:CASE0003_REVISION_ID"
          if($LASTEXITCODE -ne 0){throw 'handoff commit failed'}
          git push --force origin ("HEAD:refs/heads/"+$env:CASE0003_HANDOFF_BRANCH)
          if($LASTEXITCODE -ne 0){throw 'handoff push failed'}
          Write-Host "CASE0003_REV801_HANDOFF_PUBLISHED branch=$env:CASE0003_HANDOFF_BRANCH"
