name: Case 0004 Ingress Python Repair O87

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case-0004-ingress-python-repair-o87.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: [self-hosted, Windows, X64, O87]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Verify fixed O87 machine
        run: |
          if ($env:COMPUTERNAME -ine 'DESKTOP-O87PJNR') { throw "wrong fixed machine: $env:COMPUTERNAME" }
          Write-Host "CASE0004_INGRESS_PYTHON_REPAIR_O87_OK machine=$env:COMPUTERNAME runner=$env:RUNNER_NAME"

      - name: Checkout OpenWorker
        uses: actions/checkout@v4

      - name: Add governed repair child
        run: |
          python scripts/case_worklist_add_repair.py `
            --workspace-root 'D:\AI-Work\jobs\0004-DWG-TO-3D' `
            --parent-step '0004-020' `
            --step-id 'R-0004-020-002' `
            --title 'Use existing O87 system Python instead of setup-python download' `
            --allowed-action 'openworker.source.ingress.repair.system-python' `
            --acceptance repair_commit `
            --acceptance python_version `
            --acceptance workflow_contract

      - name: Start governed repair
        id: gate
        run: |
          $execution = "github:${{ github.run_id }}:${{ github.run_attempt }}:ingress-python-repair"
          python scripts/case_worklist_action.py start `
            --workspace-root 'D:\AI-Work\jobs\0004-DWG-TO-3D' `
            --step-id 'R-0004-020-002' `
            --action-id 'openworker.source.ingress.repair.system-python' `
            --execution-id $execution
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "execution_id=$execution`n", [Text.UTF8Encoding]::new($false))

      - name: Verify O87 system Python and repaired workflow
        id: verify
        run: |
          $version = python -c "import sys; print('.'.join(map(str, sys.version_info[:3])))"
          if ($LASTEXITCODE -ne 0) { throw 'system python unavailable on O87' }
          python -c "import sys; assert sys.version_info >= (3,10), sys.version"
          if ($LASTEXITCODE -ne 0) { throw "system Python too old: $version" }
          $workflow = Get-Content -LiteralPath '.github\workflows\engineering-local-source-ingress-win11.yml' -Raw
          if ($workflow -match 'actions/setup-python@') { throw 'ingress workflow still depends on setup-python' }
          if ($workflow -notmatch 'Verify O87 system Python') { throw 'ingress workflow missing system Python gate' }
          Write-Host "CASE0004_SYSTEM_PYTHON_CONTRACT_PASS version=$version"
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "python_version=$version`n", [Text.UTF8Encoding]::new($false))

      - name: Complete repair and return 020 to READY
        run: |
          $workspace = 'D:\AI-Work\jobs\0004-DWG-TO-3D'
          python scripts/case_worklist_action.py record --workspace-root $workspace --step-id 'R-0004-020-002' --key repair_commit --value '52d223eb48c53e38330b6cbf108380b926d6982d'
          python scripts/case_worklist_action.py record --workspace-root $workspace --step-id 'R-0004-020-002' --key python_version --value '${{ steps.verify.outputs.python_version }}'
          python scripts/case_worklist_action.py record --workspace-root $workspace --step-id 'R-0004-020-002' --key workflow_contract --value 'system Python >=3.10; no actions/setup-python dependency'
          python scripts/case_worklist_action.py complete-action `
            --workspace-root $workspace `
            --step-id 'R-0004-020-002' `
            --action-id 'openworker.source.ingress.repair.system-python' `
            --execution-id '${{ steps.gate.outputs.execution_id }}'
          python scripts/case_worklist_action.py pass --workspace-root $workspace --step-id 'R-0004-020-002'

      - name: Block repair on failure
        if: failure() && steps.gate.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/case_worklist_action.py block-active `
            --workspace-root 'D:\AI-Work\jobs\0004-DWG-TO-3D' `
            --step-id 'R-0004-020-002' `
            --reason "system Python ingress repair failed in run $env:GITHUB_RUN_ID"
