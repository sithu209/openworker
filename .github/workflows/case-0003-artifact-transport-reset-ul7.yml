name: Case 0003 Artifact Transport Reset UL7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case-0003-artifact-transport-reset-ul7.yml'

permissions:
  contents: read
  actions: write

env:
  CASE0003_ASSIGNED_HOST: DESKTOP-UL7V2VV
  CASE0003_WORKSPACE: 'D:\AI-Work\jobs\0003-YUJING-BRIDGE'
  CASE0003_REVISION_ID: rev_801b23ef3cb14941af2a0cdb54bb660f
  CASE0003_EXPECTED_MANIFEST_SHA: ef4b12ec3d03a22f89aa2148146c3e1cb004e3bad1f340f707a58787676bf15c

jobs:
  transport:
    runs-on: [self-hosted, Windows, X64, UL7]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Verify fixed host and exact revision
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ine $env:CASE0003_ASSIGNED_HOST){throw 'host mismatch'}
          $bundle=Join-Path $env:CASE0003_WORKSPACE ('.openworker\reviews\'+$env:CASE0003_REVISION_ID)
          $manifest=(Get-Content -LiteralPath (Join-Path $bundle 'manifest.sha256') -Raw).Trim().ToLowerInvariant()
          if($manifest -ne $env:CASE0003_EXPECTED_MANIFEST_SHA){throw ('manifest drift '+$manifest)}
          "CASE0003_BUNDLE=$bundle"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Delete only stale Case 0003 artifacts in this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $url="https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100"
          $page=Invoke-RestMethod -Headers $headers -Uri $url -Method Get
          $targets=@($page.artifacts | Where-Object { $_.name -match '(?i)^case-?0003' })
          foreach($a in $targets){
            Write-Host "CASE0003_DELETE_STALE_ARTIFACT id=$($a.id) name=$($a.name) size=$($a.size_in_bytes)"
            Invoke-RestMethod -Headers $headers -Uri ("https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/"+$a.id) -Method Delete
          }
          Write-Host "CASE0003_STALE_ARTIFACT_DELETE_DONE count=$($targets.Count)"

      - name: Stage exact immutable review ZIP
        run: |
          $ErrorActionPreference='Stop'
          $stage=Join-Path $env:RUNNER_TEMP ('case0003-rev801-exact-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force $stage|Out-Null
          $zip=Join-Path $stage 'case0003-rev801-review-bundle.zip'
          Compress-Archive -Path (Join-Path $env:CASE0003_BUNDLE '*') -DestinationPath $zip -CompressionLevel Optimal
          $sha=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $meta=[ordered]@{revision_id=$env:CASE0003_REVISION_ID;bundle_manifest_sha256=$env:CASE0003_EXPECTED_MANIFEST_SHA;cloud_zip_sha256=$sha;zip_bytes=(Get-Item -LiteralPath $zip).Length}
          [IO.File]::WriteAllText((Join-Path $stage 'transport-manifest.json'),($meta|ConvertTo-Json -Depth 4),[Text.UTF8Encoding]::new($false))
          "CASE0003_STAGE=$stage"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host ('CASE0003_EXACT_TRANSPORT_STAGED '+($meta|ConvertTo-Json -Compress))

      - name: Upload exact review transport artifact
        uses: actions/upload-artifact@v4
        with:
          name: case0003-rev801-exact-drive-transport-${{ github.run_id }}
          path: ${{ env.CASE0003_STAGE }}
          if-no-files-found: error
          retention-days: 1

