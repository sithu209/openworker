name: External Source Drive Ingress ODA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'external-source-ingress-requests/oda.json'

permissions:
  contents: read

concurrency:
  group: external-source-drive-ingress-oda
  cancel-in-progress: false

env:
  INGRESS_ASSIGNED_HOST: DESKTOP-ODAQN0D
  INGRESS_ALLOWED_ROOT: 'D:\AI-Work\knowledge'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  ingress:
    name: Download immutable Drive source onto fixed ODA
    runs-on: [self-hosted, Windows, X64, ODA]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

    steps:
      - name: Checkout OpenWorker main
        uses: actions/checkout@v4
        with:
          ref: main
          path: openworker

      - name: Verify fixed ODA authority and parse request
        id: request
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ine $env:INGRESS_ASSIGNED_HOST){
            throw "DRIVE_INGRESS_ASSIGNED_HOST_MISMATCH host=$env:COMPUTERNAME assigned=$env:INGRESS_ASSIGNED_HOST"
          }
          $requestPath=Join-Path $env:GITHUB_WORKSPACE 'openworker\external-source-ingress-requests\oda.json'
          if(-not (Test-Path -LiteralPath $requestPath -PathType Leaf)){throw "Drive ingress request missing: $requestPath"}
          $r=Get-Content -LiteralPath $requestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          foreach($field in @('request_id','target_machine','google_drive_file_id','expected_sha256','expected_size_bytes','destination','receipt')){
            if(-not ($r.PSObject.Properties.Name -contains $field)){throw "Drive ingress request missing field: $field"}
          }
          if([string]$r.target_machine -ine $env:COMPUTERNAME){throw "Drive ingress target mismatch request=$($r.target_machine) actual=$env:COMPUTERNAME"}
          $sha=([string]$r.expected_sha256).Trim().ToLowerInvariant()
          if($sha -notmatch '^[0-9a-f]{64}$'){throw 'Drive ingress request expected_sha256 invalid'}
          $size=[int64]$r.expected_size_bytes
          if($size -le 0){throw 'Drive ingress request expected_size_bytes must be positive'}
          $allowed=[IO.Path]::GetFullPath($env:INGRESS_ALLOWED_ROOT).TrimEnd('\') + '\'
          $destination=[IO.Path]::GetFullPath([string]$r.destination)
          $receipt=[IO.Path]::GetFullPath([string]$r.receipt)
          if(-not $destination.StartsWith($allowed,[StringComparison]::OrdinalIgnoreCase)){throw "Drive ingress destination escapes allowed root: $destination"}
          if(-not $receipt.StartsWith($allowed,[StringComparison]::OrdinalIgnoreCase)){throw "Drive ingress receipt escapes allowed root: $receipt"}
          $values=@{
            request_id=[string]$r.request_id
            file_id=[string]$r.google_drive_file_id
            sha=$sha
            size=[string]$size
            destination=$destination
            receipt=$receipt
          }
          foreach($key in $values.Keys){
            $encoded=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes([string]$values[$key]))
            "$key=$encoded" >> $env:GITHUB_OUTPUT
          }
          Write-Host "DRIVE_INGRESS_REQUEST_PASS request=$($r.request_id) machine=$env:COMPUTERNAME bytes=$size sha256=$sha"

      - name: Run targeted Drive ingress unit gate
        env:
          PYTHONPATH: ${{ github.workspace }}\openworker
        run: |
          $ErrorActionPreference='Stop'
          Set-Location (Join-Path $env:GITHUB_WORKSPACE 'openworker')
          python -m pytest tests/test_drive_ingress.py -q
          if($LASTEXITCODE -ne 0){throw 'Drive ingress targeted unit gate failed'}

      - name: Report bounded credential-source availability
        env:
          PYTHONPATH: ${{ github.workspace }}\openworker
          OPENWORKER_GOOGLE_DRIVE_ACCESS_TOKEN: ${{ secrets.OPENWORKER_GOOGLE_DRIVE_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          $code=@'
          import os
          from coworker.secrets import SecretStore
          env_present=bool(str(os.environ.get('OPENWORKER_GOOGLE_DRIVE_ACCESS_TOKEN') or '').strip())
          rows=[r for r in SecretStore().status() if str(r.get('profile') or '')=='google_drive' or str(r.get('profile') or '').startswith('google_drive:')]
          print(f'DRIVE_INGRESS_CREDENTIAL_SOURCES env_present={str(env_present).lower()} local_profiles={len(rows)} local_unexpired={sum(not bool(r.get("expired")) for r in rows)}')
          '@
          $code|python -
          if($LASTEXITCODE -ne 0){throw 'Drive ingress credential-source inspection failed'}

      - name: Resolve readable user-scoped Drive credential store
        id: credential_store
        env:
          PYTHONPATH: ${{ github.workspace }}\openworker
        run: |
          $ErrorActionPreference='Stop'
          python openworker\scripts\resolve_drive_credential_store.py --github-output $env:GITHUB_OUTPUT
          if($LASTEXITCODE -ne 0){throw 'user-scoped Drive credential-store probe failed'}

      - name: Fail-closed Drive credential preflight
        env:
          PYTHONPATH: ${{ github.workspace }}\openworker
          OPENWORKER_GOOGLE_DRIVE_ACCESS_TOKEN: ${{ secrets.OPENWORKER_GOOGLE_DRIVE_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          function Decode([string]$value){ return [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($value)) }
          $stateDirB64='${{ steps.credential_store.outputs.state_dir_b64 }}'
          if(-not [string]::IsNullOrWhiteSpace($stateDirB64)){
            $env:COWORKER_STATE_DIR=Decode $stateDirB64
          }
          $code=@'
          from coworker.drive_ingress import GoogleDriveRawDownloadClient
          from coworker.review_drive import ReviewDriveError
          try:
              client=GoogleDriveRawDownloadClient.from_environment()
          except ReviewDriveError:
              print('DRIVE_INGRESS_CREDENTIAL_UNAVAILABLE')
              raise SystemExit(2)
          else:
              client.close()
              print('DRIVE_INGRESS_CREDENTIAL_PREFLIGHT_PASS')
          '@
          $code|python -
          if($LASTEXITCODE -ne 0){throw 'Drive ingress credential provisioning is unavailable on assigned ODA runner identity'}

      - name: Download and atomically publish immutable Drive file
        env:
          PYTHONPATH: ${{ github.workspace }}\openworker
          OPENWORKER_GOOGLE_DRIVE_ACCESS_TOKEN: ${{ secrets.OPENWORKER_GOOGLE_DRIVE_ACCESS_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          function Decode([string]$value){ return [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($value)) }
          $stateDirB64='${{ steps.credential_store.outputs.state_dir_b64 }}'
          if(-not [string]::IsNullOrWhiteSpace($stateDirB64)){
            $env:COWORKER_STATE_DIR=Decode $stateDirB64
          }
          $requestId=Decode '${{ steps.request.outputs.request_id }}'
          $fileId=Decode '${{ steps.request.outputs.file_id }}'
          $sha=Decode '${{ steps.request.outputs.sha }}'
          $size=[int64](Decode '${{ steps.request.outputs.size }}')
          $destination=Decode '${{ steps.request.outputs.destination }}'
          $receipt=Decode '${{ steps.request.outputs.receipt }}'
          $args=@(
            'openworker\scripts\download_drive_file_atomic.py',
            '--file-id',$fileId,
            '--destination',$destination,
            '--expected-sha256',$sha,
            '--expected-size-bytes',[string]$size,
            '--receipt',$receipt,
            '--machine-id',$env:COMPUTERNAME,
            '--request-id',$requestId,
            '--run-id',$env:GITHUB_RUN_ID
          )
          & python @args
          if($LASTEXITCODE -ne 0){throw "Google Drive raw ingress failed exit=$LASTEXITCODE"}

      - name: Verify durable ingress receipt and canonical bytes
        run: |
          $ErrorActionPreference='Stop'
          function Decode([string]$value){ return [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($value)) }
          $fileId=Decode '${{ steps.request.outputs.file_id }}'
          $sha=Decode '${{ steps.request.outputs.sha }}'
          $size=[int64](Decode '${{ steps.request.outputs.size }}')
          $destination=Decode '${{ steps.request.outputs.destination }}'
          $receipt=Decode '${{ steps.request.outputs.receipt }}'
          if(-not (Test-Path -LiteralPath $destination -PathType Leaf)){throw 'Drive ingress canonical file missing'}
          if((Get-Item -LiteralPath $destination).Length -ne $size){throw 'Drive ingress canonical size mismatch'}
          $actual=(Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $sha){throw "Drive ingress canonical SHA mismatch actual=$actual expected=$sha"}
          if(-not (Test-Path -LiteralPath $receipt -PathType Leaf)){throw 'Drive ingress receipt missing'}
          $r=Get-Content -LiteralPath $receipt -Raw -Encoding UTF8 | ConvertFrom-Json
          if([string]$r.schema_version -ne 'openworker-drive-ingress-receipt/v1' -or [string]$r.status -ne 'PASS' -or [string]$r.transport -ne 'google-drive-api'){throw 'Drive ingress receipt contract mismatch'}
          if([string]$r.drive_file_id -ne $fileId -or [string]$r.sha256 -ne $sha -or [int64]$r.size_bytes -ne $size){throw 'Drive ingress receipt identity mismatch'}
          if([string]$r.machine_id -ine $env:COMPUTERNAME){throw 'Drive ingress receipt machine mismatch'}
          Write-Host "EXTERNAL_SOURCE_DRIVE_INGRESS_PASS machine=$env:COMPUTERNAME file_id=$fileId sha256=$sha bytes=$size destination=$destination mode=$($r.mode)"

      - name: Upload bounded ingress receipt evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: external-source-drive-ingress-oda-${{ github.run_id }}
          path: D:\AI-Work\knowledge\standards\openworker-drive-ingress-receipt.json
          if-no-files-found: warn
          retention-days: 14
