name: Case 0004 Source Locator Repair O87

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case-0004-source-locator-repair.yml'

permissions:
  contents: read

concurrency:
  group: case-0004-source-locator-repair-o87
  cancel-in-progress: false

jobs:
  repair:
    runs-on: [self-hosted, Windows, X64, O87]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Verify fixed O87 machine
        run: |
          if ($env:COMPUTERNAME -ine 'DESKTOP-O87PJNR') { throw "wrong fixed machine: $env:COMPUTERNAME" }
          Write-Host "CASE0004_REPAIR_O87_OK machine=$env:COMPUTERNAME runner=$env:RUNNER_NAME"

      - name: Checkout OpenWorker
        uses: actions/checkout@v4

      - name: Add canonical repair child to CaseWorklist
        run: |
          python scripts/case_worklist_add_repair.py `
            --workspace-root 'D:\AI-Work\jobs\0004-DWG-TO-3D' `
            --parent-step '0004-010' `
            --step-id 'R-0004-010-001' `
            --title 'Canonical source reconciliation after duplicate-source ambiguity' `
            --allowed-action 'openworker.source.locator.repair.canonical-reconcile' `
            --acceptance repair_commit `
            --acceptance canonical_path `
            --acceptance canonical_sha256

      - name: Retry blocked repair only
        run: |
          python scripts/case_worklist_retry_repair.py `
            --workspace-root 'D:\AI-Work\jobs\0004-DWG-TO-3D' `
            --step-id 'R-0004-010-001' `
            --reason "retry after UTF-8 GitHub output fix"

      - name: Start governed repair action
        id: repairgate
        run: |
          $execution = "github:${{ github.run_id }}:${{ github.run_attempt }}:locator-repair"
          python scripts/case_worklist_action.py start `
            --workspace-root 'D:\AI-Work\jobs\0004-DWG-TO-3D' `
            --step-id 'R-0004-010-001' `
            --action-id 'openworker.source.locator.repair.canonical-reconcile' `
            --execution-id $execution
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "execution_id=$execution`n", [Text.UTF8Encoding]::new($false))

      - name: Validate existing canonical source with repaired locator
        id: validate
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $request = Get-Content -LiteralPath 'source-locator-requests\request.json' -Raw | ConvertFrom-Json
          $request | Add-Member -NotePropertyName prefer_existing_canonical -NotePropertyValue $true -Force
          $tempRequest = Join-Path $env:RUNNER_TEMP 'case0004-canonical-reconcile-request.json'
          $request | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $tempRequest -Encoding utf8
          $evidence = Join-Path $env:RUNNER_TEMP 'case0004-canonical-reconcile-evidence.json'
          python scripts/engineering_source_locator.py --request $tempRequest --evidence $evidence
          if ($LASTEXITCODE -ne 0) { throw "canonical reconciliation failed: $LASTEXITCODE" }
          $r = Get-Content -LiteralPath $evidence -Raw | ConvertFrom-Json
          if (-not $r.matched -or $r.authority -ne 'canonical_workspace') { throw 'canonical reconciliation did not establish canonical_workspace authority' }
          if ($r.expected_sha256 -ne 'aaadbd84e8a5b2e1b0b8f54c16901a69085c7501aeec602929fd994f3192f5b6') { throw 'unexpected canonical SHA' }
          $utf8 = [Text.UTF8Encoding]::new($false)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "canonical_path=$($r.source_path)`n", $utf8)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "canonical_sha256=$($r.expected_sha256)`n", $utf8)

      - name: Complete repair and return parent step to READY
        run: |
          $workspace = 'D:\AI-Work\jobs\0004-DWG-TO-3D'
          python scripts/case_worklist_action.py record --workspace-root $workspace --step-id 'R-0004-010-001' --key repair_commit --value '${{ github.sha }}'
          python scripts/case_worklist_action.py record --workspace-root $workspace --step-id 'R-0004-010-001' --key canonical_path --value '${{ steps.validate.outputs.canonical_path }}'
          python scripts/case_worklist_action.py record --workspace-root $workspace --step-id 'R-0004-010-001' --key canonical_sha256 --value '${{ steps.validate.outputs.canonical_sha256 }}'
          python scripts/case_worklist_action.py complete-action `
            --workspace-root $workspace `
            --step-id 'R-0004-010-001' `
            --action-id 'openworker.source.locator.repair.canonical-reconcile' `
            --execution-id '${{ steps.repairgate.outputs.execution_id }}'
          python scripts/case_worklist_action.py pass --workspace-root $workspace --step-id 'R-0004-010-001'

      - name: Block repair when validation fails
        if: failure() && steps.repairgate.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/case_worklist_action.py block-active `
            --workspace-root 'D:\AI-Work\jobs\0004-DWG-TO-3D' `
            --step-id 'R-0004-010-001' `
            --reason "canonical locator repair failed in run $env:GITHUB_RUN_ID"
