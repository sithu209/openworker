name: Drain OpenWorker Queue From Cloud

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: openworker-queue-drain-cloud
  cancel-in-progress: false

jobs:
  drain:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[drain-openworker-queue]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel every other active OpenWorker Actions run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}/actions/runs"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          cancel_status() {
            local status="$1"
            curl -fsSL "${auth[@]}" "${api}?status=${status}&per_page=100" \
              | jq -r --arg current "${CURRENT_RUN_ID}" '.workflow_runs[] | select((.id|tostring) != $current) | .id' \
              | while read -r id; do
                  [ -z "$id" ] && continue
                  echo "cancel status=${status} run_id=${id}"
                  code=$(curl -sS -o /tmp/cancel-response -w '%{http_code}' -X POST "${auth[@]}" "${api}/${id}/cancel")
                  if [ "$code" != "202" ] && [ "$code" != "409" ]; then
                    cat /tmp/cancel-response || true
                    echo "cancel failed run_id=${id} http=${code}" >&2
                    exit 1
                  fi
                done
          }

          cancel_status queued
          cancel_status in_progress

          for i in $(seq 1 15); do
            active=$(curl -fsSL "${auth[@]}" "${api}?per_page=100" \
              | jq --arg current "${CURRENT_RUN_ID}" '[.workflow_runs[] | select((.id|tostring) != $current and (.status == "queued" or .status == "in_progress"))] | length')
            echo "verify attempt=${i} active=${active}"
            if [ "$active" = "0" ]; then
              echo "OPENWORKER_QUEUE_DRAIN_PASS current_run=${CURRENT_RUN_ID} runner=github-hosted"
              exit 0
            fi
            sleep 2
          done

          echo "OpenWorker Actions queue is not clean after cloud drain" >&2
          exit 1
