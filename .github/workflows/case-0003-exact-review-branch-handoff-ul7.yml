name: Case 0003 Exact Review Branch Handoff UL7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/case-0003-exact-review-branch-handoff-ul7.yml'

permissions:
  contents: write

env:
  CASE0003_ASSIGNED_HOST: DESKTOP-UL7V2VV
  CASE0003_WORKSPACE: 'D:\AI-Work\jobs\0003-YUJING-BRIDGE'
  CASE0003_REVISION_ID: rev_61b0104b041c4d1f8740e831a5b1d8eb
  CASE0003_EXPECTED_PNG_SHA: 1035305b3186499af007990dc9e23accdf6171934ac70b6152dcdd83cced779d
  CASE0003_HANDOFF_BRANCH: case0003-review-handoff-rev61b0104b
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  handoff:
    runs-on: [self-hosted, Windows, X64, UL7]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: openworker
          fetch-depth: 1

      - name: Verify exact fresh review inputs
        working-directory: openworker
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ine $env:CASE0003_ASSIGNED_HOST){throw 'host mismatch'}
          $state=Get-Content -LiteralPath (Join-Path $env:CASE0003_WORKSPACE 'acceptance\openworker-final\work-ledger-final-acceptance.json') -Raw|ConvertFrom-Json
          if([string]$state.revision_id -ne $env:CASE0003_REVISION_ID){throw ('revision drift '+[string]$state.revision_id)}
          $bundle=Join-Path $env:CASE0003_WORKSPACE ('.openworker\reviews\'+$env:CASE0003_REVISION_ID)
          foreach($f in @('manifest.json','manifest.sha256','review-request.json','artifacts\scenex-browse.png')){if(-not (Test-Path -LiteralPath (Join-Path $bundle $f) -PathType Leaf)){throw ('exact bundle member missing '+$f)}}
          $png=Join-Path $bundle 'artifacts\scenex-browse.png'
          $pngSha=(Get-FileHash -LiteralPath $png -Algorithm SHA256).Hash.ToLowerInvariant()
          if($pngSha -ne $env:CASE0003_EXPECTED_PNG_SHA){throw ('exact PNG SHA mismatch '+$pngSha)}
          $manifestSha=(Get-Content -LiteralPath (Join-Path $bundle 'manifest.sha256') -Raw).Trim().ToLowerInvariant()
          if($manifestSha -notmatch '^[0-9a-f]{64}$'){throw 'manifest SHA invalid'}
          "CASE0003_EXACT_BUNDLE=$bundle"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CASE0003_EXACT_PNG=$png"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CASE0003_MANIFEST_SHA=$manifestSha"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage exact binary review handoff and PDF proxy
        working-directory: openworker
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path (Get-Location) ('review-handoff\case0003\'+$env:CASE0003_REVISION_ID)
          if(Test-Path -LiteralPath $root){Remove-Item -LiteralPath $root -Recurse -Force}
          New-Item -ItemType Directory -Force $root|Out-Null
          $zip=Join-Path $env:RUNNER_TEMP ('case0003-'+$env:CASE0003_REVISION_ID+'-review-bundle.zip')
          if(Test-Path -LiteralPath $zip){Remove-Item -LiteralPath $zip -Force}
          Compress-Archive -Path (Join-Path $env:CASE0003_EXACT_BUNDLE '*') -DestinationPath $zip -CompressionLevel Optimal
          if(-not (Test-Path -LiteralPath $zip -PathType Leaf)){throw 'exact review ZIP missing'}

          $directPng=Join-Path $root 'scenex-browse.png'
          $directZip=Join-Path $root 'review-bundle.zip'
          $pdf=Join-Path $root 'scenex-browse-review.pdf'
          Copy-Item -LiteralPath $env:CASE0003_EXACT_PNG -Destination $directPng -Force
          Copy-Item -LiteralPath $zip -Destination $directZip -Force

          $py=@'
          from PIL import Image
          import os
          src=os.environ['CASE0003_EXACT_PNG']
          dst=os.environ['CASE0003_REVIEW_PDF']
          im=Image.open(src).convert('RGB')
          im.save(dst,'PDF',resolution=144.0,quality=95,subsampling=0)
          '@
          "CASE0003_REVIEW_PDF=$pdf"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $env:CASE0003_REVIEW_PDF=$pdf
          try { $py|python - } catch { python -m pip install --user Pillow; if($LASTEXITCODE -ne 0){throw}; $py|python - }
          if($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $pdf -PathType Leaf)){throw 'failed to create SceneX review PDF proxy'}

          function Write-Chunked([string]$source,[string]$name){
            $bytes=[IO.File]::ReadAllBytes($source)
            $sha=(Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
            $b64=[Convert]::ToBase64String($bytes)
            $dir=Join-Path $root $name
            New-Item -ItemType Directory -Force $dir|Out-Null
            $chunkSize=75000
            $partCount=[Math]::Ceiling($b64.Length/[double]$chunkSize)
            for($i=0;$i -lt $partCount;$i++){
              $start=$i*$chunkSize
              $len=[Math]::Min($chunkSize,$b64.Length-$start)
              [IO.File]::WriteAllText((Join-Path $dir ('part-{0:D3}.txt' -f $i)),$b64.Substring($start,$len),[Text.UTF8Encoding]::new($false))
            }
            return [ordered]@{name=$name;sha256=$sha;byte_length=$bytes.Length;base64_length=$b64.Length;chunk_size=$chunkSize;part_count=[int]$partCount}
          }

          $pngMeta=Write-Chunked $env:CASE0003_EXACT_PNG 'scenex-png'
          $zipMeta=Write-Chunked $zip 'review-bundle-zip'
          $pdfSha=(Get-FileHash -LiteralPath $pdf -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest=[ordered]@{
            schema_version='openworker-private-review-handoff/v1'
            case_id='0003'
            revision_id=$env:CASE0003_REVISION_ID
            source='exact-review-bundle'
            assigned_host=$env:CASE0003_ASSIGNED_HOST
            runner_name=$env:RUNNER_NAME
            github_run_id=$env:GITHUB_RUN_ID
            bundle_manifest_sha256=$env:CASE0003_MANIFEST_SHA
            png=$pngMeta
            review_bundle_zip=$zipMeta
            direct_png='scenex-browse.png'
            direct_review_bundle_zip='review-bundle.zip'
            review_pdf_proxy=[ordered]@{path='scenex-browse-review.pdf';sha256=$pdfSha;source_png_sha256=$pngMeta.sha256}
          }
          [IO.File]::WriteAllText((Join-Path $root 'handoff-manifest.json'),($manifest|ConvertTo-Json -Depth 10),[Text.UTF8Encoding]::new($false))
          Write-Host "CASE0003_PRIVATE_HANDOFF_STAGED png_sha=$($pngMeta.sha256) zip_sha=$($zipMeta.sha256) pdf_sha=$pdfSha manifest=$env:CASE0003_MANIFEST_SHA"

      - name: Publish private review handoff branch
        working-directory: openworker
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B $env:CASE0003_HANDOFF_BRANCH
          git add -- review-handoff/case0003/$env:CASE0003_REVISION_ID
          git commit -m "case0003: stage exact review PDF handoff $env:CASE0003_REVISION_ID"
          if($LASTEXITCODE -ne 0){throw 'failed to commit private review handoff'}
          git push --force-with-lease origin ("HEAD:refs/heads/"+$env:CASE0003_HANDOFF_BRANCH)
          if($LASTEXITCODE -ne 0){throw 'failed to publish private review handoff branch'}
          Write-Host "CASE0003_PRIVATE_HANDOFF_PUBLISHED branch=$env:CASE0003_HANDOFF_BRANCH revision=$env:CASE0003_REVISION_ID"

