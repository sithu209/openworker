name: Case0004 DirectWork 045 O87

on:
  push:
    branches: [main]
    paths:
      - 'secret-requests/case0004-directwork-o87.json'
      - '.github/workflows/case0004-directwork-045-o87.yml'
      - 'scripts/case0004-directwork-045.ps1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: [self-hosted, Windows, X64, O87]
    timeout-minutes: 35
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Submit Case0004 045 as one DirectWork durable job
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ine 'DESKTOP-O87PJNR'){throw "wrong host $env:COMPUTERNAME"}
          $requestPath=Join-Path $env:GITHUB_WORKSPACE 'secret-requests\case0004-directwork-o87.json'
          $req=Get-Content -LiteralPath $requestPath -Raw|ConvertFrom-Json
          if([string]$req.schema -ne 'directwork.secret-command.v1'){throw "bad schema=$($req.schema)"}
          if([string]$req.phrase -ne 'CASE0004.DIRECTWORK.045'){throw "bad phrase=$($req.phrase)"}
          $requestId=[string]$req.request_id
          if($requestId -notmatch '^[A-Za-z0-9._-]{8,96}$'){throw "bad request_id=$requestId"}
          $jobId=('directwork-case0004-045-'+$requestId).ToLowerInvariant()
          $workspace='D:\AI-Work\jobs\0004-DWG-TO-3D'
          $script=Join-Path $env:GITHUB_WORKSPACE 'scripts\case0004-directwork-045.ps1'
          $command='powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "'+$script+'" -RequestId "'+$requestId+'"'
          $body=[ordered]@{job_id=$jobId;dispatch_id=$requestId;machine='DESKTOP-O87PJNR';priority=100;command=$command;cwd=$workspace;workspace_root=$workspace;timeout_sec=1800;locks=@('case0004','case0004.045','dwg.story-index')}
          $ack=Invoke-RestMethod -Method POST -Uri 'http://127.0.0.1:8787/v1/jobs' -ContentType 'application/json' -Body ($body|ConvertTo-Json -Depth 20) -TimeoutSec 10
          if($ack.accepted -ne $true){throw 'DirectWork durable endpoint did not accept job'}

          $submitted=[ordered]@{schema='case0004.directwork-submit-receipt.v1';phrase='CASE0004.DIRECTWORK.045';request_id=$requestId;job_id=$jobId;machine=$env:COMPUTERNAME;authority='directwork-durable-job';github_action_used_for_business_execution=$false;ack=$ack;github_run_id=$env:GITHUB_RUN_ID;observed_at=[DateTimeOffset]::UtcNow.ToString('o')}
          $submitRel="secret-results/case0004-directwork/$requestId.submitted.json"
          $submitOut=Join-Path $env:GITHUB_WORKSPACE ($submitRel -replace '/','\')
          New-Item -ItemType Directory -Force -Path (Split-Path $submitOut)|Out-Null
          [IO.File]::WriteAllText($submitOut,($submitted|ConvertTo-Json -Depth 30)+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          git config user.name 'directwork-case0004-transport'
          git config user.email 'directwork-case0004-transport@users.noreply.github.com'
          git add -- $submitRel
          git commit -m ("submitted: Case0004 DirectWork 045 "+$requestId)
          if($LASTEXITCODE -ne 0){throw 'failed to commit submit receipt'}
          $pushed=$false
          for($n=0;$n -lt 4;$n++){git pull --rebase origin main;if($LASTEXITCODE -ne 0){git rebase --abort 2>$null;Start-Sleep -Seconds 1;continue};git push origin HEAD:main;if($LASTEXITCODE -eq 0){$pushed=$true;break};Start-Sleep -Seconds 2}
          if(-not$pushed){throw 'failed to push submit receipt'}

          # Refresh checkout after the submit-receipt push, then observe the durable job.
          git pull --rebase origin main
          $terminal=@('succeeded','failed','timed_out','cancelled','stale')
          $job=$null
          for($i=0;$i -lt 1800;$i++){
            $job=Invoke-RestMethod -Method GET -Uri ('http://127.0.0.1:8787/v1/jobs/'+[uri]::EscapeDataString($jobId)) -TimeoutSec 10
            if($terminal -contains [string]$job.status){break}
            Start-Sleep -Seconds 1
          }
          if($null-eq$job){throw 'DirectWork job not readable'}
          try{$events=Invoke-RestMethod -Method GET -Uri ('http://127.0.0.1:8787/v1/jobs/'+[uri]::EscapeDataString($jobId)+'/events?limit=300') -TimeoutSec 10}catch{$events=[ordered]@{error=$_.Exception.Message}}
          try{$artifacts=Invoke-RestMethod -Method GET -Uri ('http://127.0.0.1:8787/v1/jobs/'+[uri]::EscapeDataString($jobId)+'/artifacts') -TimeoutSec 10}catch{$artifacts=[ordered]@{error=$_.Exception.Message}}
          $stdout='';$stderr=''
          if($job.stdout_path -and(Test-Path -LiteralPath $job.stdout_path)){ $stdout=Get-Content -LiteralPath $job.stdout_path -Raw -ErrorAction SilentlyContinue }
          if($job.stderr_path -and(Test-Path -LiteralPath $job.stderr_path)){ $stderr=Get-Content -LiteralPath $job.stderr_path -Raw -ErrorAction SilentlyContinue }
          $caseEvidence=Join-Path $workspace ('evidence\directwork\'+$requestId)
          $files=@()
          if(Test-Path -LiteralPath $caseEvidence -PathType Container){foreach($f in Get-ChildItem -LiteralPath $caseEvidence -File){$files+=[ordered]@{name=$f.Name;path=$f.FullName;size=$f.Length;sha256=(Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}}}
          $receipt=[ordered]@{schema='case0004.directwork-terminal-receipt.v1';phrase='CASE0004.DIRECTWORK.045';request_id=$requestId;job_id=$jobId;machine=$env:COMPUTERNAME;authority='directwork-durable-job';github_action_used_for_business_execution=$false;durable_job=$job;durable_events=$events;artifacts_api=$artifacts;case_evidence=$files;stdout=$stdout;stderr=$stderr;github_run_id=$env:GITHUB_RUN_ID;observed_at=[DateTimeOffset]::UtcNow.ToString('o')}
          $rel="secret-results/case0004-directwork/$requestId.terminal.json"
          $out=Join-Path $env:GITHUB_WORKSPACE ($rel -replace '/','\')
          [IO.File]::WriteAllText($out,($receipt|ConvertTo-Json -Depth 100)+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          git add -- $rel
          git commit -m ("receipt: Case0004 DirectWork 045 "+$requestId)
          if($LASTEXITCODE -ne 0){throw 'failed to commit terminal receipt'}
          $pushed=$false
          for($n=0;$n -lt 4;$n++){git pull --rebase origin main;if($LASTEXITCODE -ne 0){git rebase --abort 2>$null;Start-Sleep -Seconds 1;continue};git push origin HEAD:main;if($LASTEXITCODE -eq 0){$pushed=$true;break};Start-Sleep -Seconds 2}
          if(-not$pushed){throw 'failed to push terminal receipt'}
          if([string]$job.status -ne 'succeeded'){throw "Case0004 045 durable job ended status=$($job.status) exit=$($job.exit_code)"}
