name: OpenWorker Supervisor Phase1 Verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, ODA]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify ODA computer
        shell: powershell
        run: |
          if($env:COMPUTERNAME -ine 'DESKTOP-ODAQN0D'){throw "wrong host $env:COMPUTERNAME"}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: go-runtime/go.sum
      - name: Run Go supervisor tests
        shell: powershell
        working-directory: go-runtime
        run: |
          go test ./internal/store ./internal/api
          go test ./...
      - name: Build OpenWorkerNode
        shell: powershell
        working-directory: go-runtime
        run: go build ./cmd/openworker-node
      - name: Verify supervisor transport script parses
        shell: powershell
        run: |
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$env:GITHUB_WORKSPACE\scripts\openworker_supervisor_control.ps1",[ref]$null,[ref]$errors)
          if($errors.Count -gt 0){$errors|Format-List|Out-String|Write-Error;exit 1}
