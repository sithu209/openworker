name: Case 0004 One-Call Queue Drain Latest Go Tool

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-case0004-one-call-queue-drain-latest-gotool.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  drain:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Route by exact computer name
        id: route
        shell: cmd
        run: |
          @echo off
          if /I not "%COMPUTERNAME%"=="DESKTOP-O87PJNR" (
            echo run=false>>"%GITHUB_OUTPUT%"
            exit /b 0
          )
          echo run=true>>"%GITHUB_OUTPUT%"

      - name: Checkout latest OpenWorker
        if: steps.route.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Checkout latest go-tool-runtime
        if: steps.route.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: liuxb99/go-tool-runtime
          ref: main
          path: _go-tool-runtime

      - name: Ask latest go-tool queue authority
        if: steps.route.outputs.run == 'true'
        run: |
          Push-Location '_go-tool-runtime'
          try {
            go run ./cmd/gtr-actions-queue --config config.yaml --capability dwg.story_index.queue.admin --workflow-scoped=true --exclude-run-id $env:GITHUB_RUN_ID | Tee-Object -FilePath '..\go-tool-queue-query.json'
            if($LASTEXITCODE -ne 0){throw 'latest go-tool queue query failed'}
            $q=Get-Content -LiteralPath '..\go-tool-queue-query.json' -Raw|ConvertFrom-Json
            if($q.capability -ne 'dwg.story_index.queue.admin'){throw 'go-tool did not resolve expected registered queue-admin capability'}
          } finally { Pop-Location }

      - name: Execute OpenWorker one-call drain
        if: steps.route.outputs.run == 'true'
        env:
          OPENWORKER_GO_TOOL_RUNTIME_ROOT: ${{ github.workspace }}\_go-tool-runtime
        run: |
          New-Item -ItemType Directory -Force -Path 'evidence\ops'|Out-Null
          $out='evidence\ops\latest-queue-drain.json'
          python -m coworker.queue_drain --capability 'dwg.story_index.queue.admin' --runtime-root '${{ github.workspace }}\_go-tool-runtime' --timeout-seconds 120 --verify-seconds 30 | Tee-Object -FilePath $out
          if($LASTEXITCODE -ne 0){throw 'OpenWorker one-call queue drain failed closed'}
          $obj=Get-Content -LiteralPath $out -Raw|ConvertFrom-Json
          if(-not $obj.clean){throw 'queue drain did not prove clean=true'}
          if($obj.remaining_active -and @($obj.remaining_active).Count -gt 0){throw 'queue drain left active runs'}
          $wrapped=[ordered]@{
            schema='openworker.queue-drain.evidence.v1'
            case_id='0004'
            run_id=$env:GITHUB_RUN_ID
            machine=$env:COMPUTERNAME
            runner=$env:RUNNER_NAME
            capability='dwg.story_index.queue.admin'
            go_tool_query=(Get-Content -LiteralPath 'go-tool-queue-query.json' -Raw|ConvertFrom-Json)
            result=$obj
          }
          [IO.File]::WriteAllText($out,($wrapped|ConvertTo-Json -Depth 100),(New-Object Text.UTF8Encoding($false)))

      - name: Publish drain evidence
        if: steps.route.outputs.run == 'true'
        run: |
          git config user.name 'openworker-queue-drain'
          git config user.email 'actions@users.noreply.github.com'
          git add -- evidence/ops/latest-queue-drain.json
          if(-not(git diff --cached --quiet)){git commit -m "ops(case0004): publish one-call drain evidence $env:GITHUB_RUN_ID"}
          git pull --rebase origin main
          if($LASTEXITCODE -ne 0){throw 'rebase failed'}
          git push origin HEAD:main
          if($LASTEXITCODE -ne 0){throw 'push failed'}

      - name: Publish failure diagnostic
        if: always() && steps.route.outputs.run == 'true'
        run: |
          if(Test-Path 'evidence\ops\latest-queue-drain.json'){ exit 0 }
          New-Item -ItemType Directory -Force -Path 'evidence\ops'|Out-Null
          $queryPath='go-tool-queue-query.json'
          $diag=[ordered]@{
            schema='openworker.queue-drain.failure.v1'
            case_id='0004'
            run_id=$env:GITHUB_RUN_ID
            machine=$env:COMPUTERNAME
            runner=$env:RUNNER_NAME
            capability='dwg.story_index.queue.admin'
            go_tool_query_exists=(Test-Path $queryPath)
            go_tool_query_raw=$(if(Test-Path $queryPath){Get-Content -LiteralPath $queryPath -Raw}else{$null})
            queue_drain_output_exists=$false
          }
          [IO.File]::WriteAllText('evidence\ops\latest-queue-drain-failure.json',($diag|ConvertTo-Json -Depth 50),(New-Object Text.UTF8Encoding($false)))
          git config user.name 'openworker-queue-drain'
          git config user.email 'actions@users.noreply.github.com'
          git add -- evidence/ops/latest-queue-drain-failure.json
          if(-not(git diff --cached --quiet)){git commit -m "ops(case0004): publish queue drain failure diagnostic $env:GITHUB_RUN_ID"}
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Non-target candidate exits cleanly
        if: steps.route.outputs.run != 'true'
        shell: cmd
        run: echo CASE0004_QUEUE_DRAIN_SKIP machine=%COMPUTERNAME% runner=%RUNNER_NAME%

